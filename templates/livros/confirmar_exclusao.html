{% extends 'base.html' %}

{% block title %}Confirmar Exclusão - {{ livro.titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirmar Exclusão</h5>
            </div>
            <div class="card-body p-4">
                <p>Tem certeza de que deseja excluir o livro <strong>"{{ livro.titulo }}"</strong>?</p>
                <p class="text-muted small">Esta ação não poderá ser desfeita.</p>
                <form method="post" class="d-flex justify-content-between mt-4">
                    {% csrf_token %}
                    <a href="{% url 'livros:detalhe' livro.pk %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sim, Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
