{% extends 'base.html' %}

{% block title %}Entrar - Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-center">Entrar na Biblioteca</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Entrar</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <small>Ainda não tem conta? <a href="{% url 'favoritos:registro' %}">Cadastre-se</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
